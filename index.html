<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Seleção SIAPE</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .card-select {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      cursor: pointer;
    }

    .card:focus {
      outline: 2px solid #007bff;
    }

    .card.selected {
      border-color: #007bff;
      background: #eef5ff;
    }

    .card-header {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 4px 8px;
    }

    .label {
      font-weight: 600;
      color: #666;
    }

    .value.vazio {
      color: #aaa;
    }
  </style>
</head>

<body>

  <label><strong>Selecionar SIAPE</strong></label>

  <div class="card-select" id="lista-siape"></div>

  <script>
    const container = document.getElementById("lista-siape");

    async function carregarDados() {
      try {
        const response = await fetch("./config.json");

        if (!response.ok) {
          throw new Error("Erro ao carregar JSON");
        }

        const data = await response.json();

        renderCards(data.dados); // <-- ajuste conforme sua estrutura
      } catch (erro) {
        console.error("Erro:", erro);
        container.innerHTML = "<p>Erro ao carregar dados.</p>";
      }
    }

    function renderCards(lista) {
      lista.forEach(item => {

        const card = document.createElement("div");
        card.className = "card";
        card.tabIndex = 0;

        card.innerHTML = `
          <div class="card-header">
            <span>${item.siape}</span>
          </div>

          <div class="card-grid">
            <span class="label">Nome</span>
            <span class="value">${item.nome}</span>

            <span class="label">Cargo</span>
            <span class="value">${item.cargo}</span>

            <span class="label">Regime</span>
            <span class="value">${item.regime}</span>

            <span class="label">CPF</span>
            <span class="value">${item.cpf}</span>
          </div>
        `;

        // clique
        card.addEventListener("click", () => selecionar(card, item));

        // teclado
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selecionar(card, item);
          }
        });

        container.appendChild(card);
      });
    }

    function selecionar(card, item) {
      document.querySelectorAll(".card").forEach(c => {
        c.classList.remove("selected");
      });

      card.classList.add("selected");

      console.log("Selecionado:", item);
    }

    carregarDados();
  </script>

</body>
</html>
